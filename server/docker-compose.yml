services:
  mongodb:
    image: mongo:latest
    container_name: daily_memo_db
    environment:
      MONGO_INITDB_ROOT_USERNAME: daily_memo_user
      MONGO_INITDB_ROOT_PASSWORD: daily_memo_password
      MONGO_INITDB_DATABASE: daily_memo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
