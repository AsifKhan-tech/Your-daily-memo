version: "3.8"

services:
  mongodb:
    image: mongo:latest
    container_name: daily_memo_db

    environment:
    MONGO_DB: daily_memo
    MONGO_USER: daily_memo_user
    MONGO_PASSWORD: daily_memo_password

    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
