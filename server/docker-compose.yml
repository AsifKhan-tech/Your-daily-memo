services:
  mongodb:
    image: mongo:9.0
    container_name: daily_memo_db
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  mongo-express:
    image: mongo-express:latest
    container_name: daily_memo_mongo_express
    restart: unless-stopped
    environment:
      - ME_CONFIG_MONGODB_URL="mongodb://admin:password@mongodb:27017/"
    ports:
      - "8081:8081"
    depends_on:
      - mongodb

volumes:
  mongo_data:
