<!doctype html>
<html lang="en">
  <head>
    <!-- Character set, favicon, and viewport so the planner scales on phones. -->
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/daily-memo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daily Memo | Your personal daily planner</title>
    <!-- Bundled styles: theme tokens, resets, components, then responsive overrides. -->
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- Sticky header: brand home link, in-page section links, theme switch, mobile menu. -->
    <header class="site-header">
      <nav class="navbar" aria-label="Primary navigation">
        <!-- Brand mark + title jump to the memo card (#home). -->
        <a class="brand" href="#home" aria-label="Daily Memo home">
          <span class="brand-mark" aria-hidden="true">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M6 3h8l4 4v14H6z" />
              <path d="M14 3v5h4M9 13h6M9 17h4" />
            </svg>
          </span>
          <span>Daily Memo</span>
        </a>
        <!-- Hamburger shown on smaller screens; aria-expanded is toggled in main.js. -->
        <button
          class="menu-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="primary-nav"
          aria-label="Open navigation menu"
        >
          <span></span>
          <span></span>
          <span></span>
        </button>
        <div class="nav-links" id="primary-nav" role="list">
          <a href="#home" role="listitem">Home</a>
          <a href="#todos" role="listitem">Todos</a>
          <a href="#contact" role="listitem">Contact us</a>
          <!-- Sun/moon icons swap with data-theme on <html>; click handler lives in main.js. -->
          <button
            class="theme-toggle"
            id="theme-toggle"
            type="button"
            aria-label="Switch to light mode"
            title="Light mode"
          >
            <svg
              class="theme-icon theme-icon-sun"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="4" />
              <path
                d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"
              />
            </svg>
            <svg
              class="theme-icon theme-icon-moon"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path d="M21 12.8A8.5 8.5 0 1 1 11.2 3 6.5 6.5 0 0 0 21 12.8Z" />
            </svg>
          </button>
        </div>
      </nav>
    </header>

    <!-- Page body: memo card first, contact card second. Both share #home as the shell id. -->
    <main class="app-shell" id="home">
      <!-- Create a memo, then review the saved list below the form. -->
      <section class="todo-container" aria-labelledby="memo-title">
        <p class="eyebrow">Daily memo</p>
        <h1 id="memo-title">What’s on your mind?</h1>
        <p class="intro">Capture a task before it slips away.</p>

        <!-- New task: text + datetime; submit creates a row via the form handler in main.js. -->
        <form class="todo-form">
          <div class="input-group">
            <label for="todo">New memo</label>
            <input
              id="todo"
              class="todo"
              type="text"
              name="todo"
              placeholder="Today’s task"
              autocomplete="off"
              required
            />
            <label for="todo-date-time">Date and time</label>
            <input
              id="todo-date-time"
              class="todo todo-date-time"
              type="datetime-local"
              name="date-time"
              required
            />
          </div>
          <button class="add-todo" id="todo-btn" type="submit">Add memo</button>
        </form>

        <!-- Saved tasks: count, select-all / delete-all, empty message, live list. -->
        <section
          class="todo-list-section"
          id="todos"
          aria-labelledby="memo-list-title"
        >
          <div class="list-heading">
            <h2 id="memo-list-title">All tasks</h2>
            <!-- Count is filled from the in-memory todos array. -->
            <span class="todo-count" id="todo-count">0</span>
          </div>
          <div class="list-actions">
            <!-- Checking this marks every row complete and unlocks Delete all. -->
            <label class="all-items-control" for="all-items">
              <input id="all-items" class="todo-checkbox" type="checkbox" />
              <span>All items</span>
            </label>
            <button class="delete-all" id="delete-all" type="button" disabled>
              Delete all
            </button>
          </div>
          <!-- Hidden once at least one task exists. -->
          <p class="empty-state" id="empty-state">
            Your added tasks will appear here.
          </p>
          <!-- Rows are created in JavaScript; aria-live announces list changes. -->
          <ul class="todo-list" id="todo-list" aria-live="polite"></ul>
        </section>
      </section>

      <!-- Standalone contact card (not nested in the memo card) so it can be a separate destination. -->
      <section
        class="contact-section"
        id="contact"
        aria-labelledby="contact-title"
      >
        <p class="eyebrow">Contact us</p>
        <h2 id="contact-title">How can we help?</h2>
        <!-- Client-only submit: shows a status message; there is no backend yet. -->
        <form class="contact-form" id="contact-form">
          <label for="contact-name">Name or email</label>
          <input
            class="todo"
            id="contact-name"
            name="contact-name"
            type="text"
            placeholder="Your name or email"
            autocomplete="email"
            required
          />
          <label for="contact-description">Description</label>
          <textarea
            class="todo contact-description"
            id="contact-description"
            name="description"
            placeholder="Tell us how we can help"
            rows="6"
            required
          ></textarea>
          <button class="add-todo" type="submit">Send message</button>
          <p
            class="contact-status"
            id="contact-status"
            role="status"
            aria-live="polite"
          ></p>
        </form>
      </section>
    </main>

    <!-- Persistent chrome: brand, same section links as the header, copyright year filled by JS. -->
    <footer class="site-footer">
      <div class="footer-content">
        <a
          class="footer-brand"
          href="#home"
          aria-label="Return to Daily Memo home"
        >
          <span class="brand-mark" aria-hidden="true">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M6 3h8l4 4v14H6z" />
              <path d="M14 3v5h4M9 13h6M9 17h4" />
            </svg>
          </span>
          <span>Daily Memo</span>
        </a>
        <nav class="footer-links" aria-label="Footer navigation">
          <a href="#home">Home</a>
          <a href="#todos">Todos</a>
          <a href="#contact">Contact us</a>
        </nav>
        <p class="footer-note">
          <span>&copy; </span><span id="current-year"></span> Daily Memo
        </p>
      </div>
    </footer>
    <!-- Appears after scrolling away from the navbar; click returns to the top. -->
    <button
      class="scroll-top"
      id="scroll-top"
      type="button"
      aria-label="Scroll to navbar"
      hidden
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="m5 12 7-7 7 7M12 19V5" />
      </svg>
    </button>
    <!-- App logic: theme, navigation, todos, persistence. -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
